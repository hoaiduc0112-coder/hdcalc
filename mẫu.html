<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[Tên thang điểm] - [Mục đích]</title>
  <meta name="specialty" content="[Chuyên khoa]">
  <meta name="description" content="[Mô tả tóm tắt ngắn gọn ứng dụng]">
  <style>
    :root {
      --primary: #1070e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #475569;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px 16px; line-height: 1.5; }
    .container { max-width: 760px; margin: 0 auto; }
    
    .header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .badge { display: inline-block; background: #eff6ff; color: var(--primary); font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 9999px; margin-bottom: 8px; }
    h1 { font-size: 24px; color: var(--text); margin-bottom: 6px; }
    .desc { color: var(--subtext); font-size: 14px; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .item:last-child { border-bottom: none; }
    
    .btn-group { display: flex; gap: 8px; }
    .btn-opt { border: 1px solid var(--border); background: #f1f5f9; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-opt.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .result-box { background: #fff; border: 2px solid var(--border); border-radius: 10px; padding: 20px; text-align: center; margin-bottom: 16px; }
    .score { font-size: 36px; font-weight: 800; color: var(--primary); }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; margin: 8px 0; }

    .guide { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; font-size: 13.5px; color: var(--subtext); }
    .guide h3 { color: var(--text); margin-bottom: 8px; font-size: 15px; }
    .guide ul { padding-left: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="badge">[Chuyên khoa]</span>
    <h1>[Tên thang điểm]</h1>
    <p class="desc">[Mô tả tóm tắt ứng dụng]</p>
  </div>

  <div class="card" id="form-container">
    <!-- Các tiêu chí đánh giá đặt tại đây -->
  </div>

  <div class="result-box" id="result-box">
    <div class="score" id="total-score">0 điểm</div>
    <div class="tag" id="status-tag">Phân tầng nguy cơ</div>
    <div id="recommendation">Gợi ý xử trí</div>
  </div>

  <div class="guide">
    <h3>Hướng dẫn & Diễn giải lâm sàng</h3>
    <ul>
      <li>Quy tắc và bằng chứng y học...</li>
    </ul>
  </div>
</div>

<script>
  // Script tính điểm logic thời gian thực
</script>
</body>
</html>
