<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDCalc Tiếng Việt - Thư viện Thang điểm Lâm sàng</title>
  <style>
    :root {
      --primary: #1070e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px 80px; }
    .container { max-width: 900px; margin: 0 auto; }
    
    header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 24px; color: var(--primary); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .subtitle { font-size: 14px; color: var(--subtext); }

    .search-box { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; margin-bottom: 20px; outline: none; background: #ffffff; }
    .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(16, 112, 229, 0.15); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; text-decoration: none; color: inherit; transition: transform 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(0,0,0,0.06); border-color: var(--primary); }
    .card-title { font-size: 16px; font-weight: 600; color: #0f172a; margin-bottom: 6px; }
    .card-meta { font-size: 12px; color: var(--primary); background: #eff6ff; display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; width: fit-content; font-weight: 500; }
    .card-desc { font-size: 13px; color: var(--subtext); line-height: 1.4; flex-grow: 1; }

    .status-msg { text-align: center; padding: 40px 0; color: var(--subtext); font-size: 15px; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid rgba(16,112,229,0.2); border-radius: 50%; border-top-color: var(--primary); animation: spin 0.8s ease-in-out infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🩺 HDCalc Tiếng Việt</h1>
    <div class="subtitle">Thư viện tra cứu &amp; tính toán điểm lâm sàng y khoa</div>
  </header>

  <input type="text" id="search" class="search-box" placeholder="Tìm kiếm thang điểm (ví dụ: CURB-65, BISAP, Child-Pugh, Hô hấp...)...">

  <div id="status-container" class="status-msg">
    <div class="spinner"></div>
    <div>Đang tải danh sách công cụ từ GitHub...</div>
  </div>

  <div id="calculator-list" class="grid"></div>
</div>

<script>
  // Cấu hình tài khoản GitHub và kho lưu trữ của bạn
  const GITHUB_USER = 'hoaiduc0112-coder';
  const GITHUB_REPO = 'hdcalc';

  let calculators = [];
  const listEl = document.getElementById('calculator-list');
  const searchEl = document.getElementById('search');
  const statusEl = document.getElementById('status-container');

  async function loadCalculators() {
    try {
      // 1. Gọi GitHub API để lấy danh sách file trong kho
      const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
      if (!res.ok) throw new Error('Không thể kết nối với GitHub API');
      
      const files = await res.json();
      
      // 2. Lọc ra các file HTML (loại trừ index.html)
      const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name.toLowerCase() !== 'index.html');

      if (htmlFiles.length === 0) {
        statusEl.innerHTML = 'Chưa có thang điểm nào được tải lên.';
        return;
      }

      // 3. Đọc nội dung từng file HTML để lấy <title>, <meta name="specialty">, <meta name="description">
      const fetchPromises = htmlFiles.map(async (file) => {
        try {
          const rawRes = await fetch(file.download_url);
          const text = await rawRes.text();
          
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          
          const title = doc.querySelector('title')?.innerText || file.name.replace('.html', '').toUpperCase();
          const specialty = doc.querySelector('meta[name="specialty"]')?.getAttribute('content') || 'Cấp cứu / Đa khoa';
          const desc = doc.querySelector('meta[name="description"]')?.getAttribute('content') || 'Bấm để mở công cụ tính toán điểm lâm sàng.';

          return {
            filename: file.name,
            title: title,
            specialty: specialty,
            desc: desc
          };
        } catch (e) {
          return {
            filename: file.name,
            title: file.name.replace('.html', '').toUpperCase(),
            specialty: 'Y khoa',
            desc: 'Bấm để mở công cụ tính toán.'
          };
        }
      });

      calculators = await Promise.all(fetchPromises);
      statusEl.style.display = 'none';
      renderList(calculators);

    } catch (err) {
      console.error(err);
      statusEl.innerHTML = 'Lỗi tải danh sách: Hãy kiểm tra lại kết nối mạng hoặc kho lưu trữ GitHub.';
    }
  }

  function renderList(items) {
    listEl.innerHTML = '';
    if (items.length === 0) {
      statusEl.style.display = 'block';
      statusEl.innerHTML = 'Không tìm thấy thang điểm phù hợp.';
      return;
    }
    statusEl.style.display = 'none';

    items.forEach(calc => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = calc.filename;
      card.innerHTML = `
        <span class="card-meta">${calc.specialty}</span>
        <div class="card-title">${calc.title}</div>
        <div class="card-desc">${calc.desc}</div>
      `;
      listEl.appendChild(card);
    });
  }

  // Lắng nghe ô tìm kiếm
  searchEl.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = calculators.filter(c => 
      c.title.toLowerCase().includes(term) || 
      c.specialty.toLowerCase().includes(term) || 
      c.desc.toLowerCase().includes(term) ||
      c.filename.toLowerCase().includes(term)
    );
    renderList(filtered);
  });

  // Chạy ứng dụng
  loadCalculators();
</script>

</body>
</html>
